# ============================================
# APIM Products Management Component
#
# A reusable CI/CD component for managing Products
# in Azure API Management.
#
# Usage:
#   include:
#     - component: $CI_SERVER_FQDN/devops/components/api-management/apim-products@1.0.0
#
# Then run the pipeline and fill in the variables in the UI.
#
# ============================================
# Required CI/CD Variables (set in consuming project):
#
# Azure - Shared:
#   AZ_TENANT_ID
#
# Azure - Per environment (DEV, TST, STG, PRD):
#   {ENV}_AZ_SPN_CLIENT_ID
#   {ENV}_AZ_SPN_CLIENT_SECRET
#   {ENV}_AZ_SUBSCRIPTION_ID
#   {ENV}_RESOURCE_GROUP
#   {ENV}_APIM_SERVICE
# ============================================

spec:
  inputs: {}

---

# ============================================
# Pipeline Variables (shown in Run Pipeline UI)
# ============================================
variables:
  # -----------------------------------------------
  # Container Images (self-hosted in GitLab registry)
  # Change these to point to your internal registry
  # -----------------------------------------------
  IMAGE_AZURE_CLI: "${CI_REGISTRY}/devops/images/azure-cli:latest"
  IMAGE_PYTHON: "${CI_REGISTRY}/devops/images/python:3.11-slim"
  IMAGE_ALPINE: "${CI_REGISTRY}/devops/images/alpine:latest"

  # Internal variables
  AZURE_API_VERSION: "2022-08-01"

  # -----------------------------------------------
  # User-provided variables (shown in Run Pipeline UI)
  # -----------------------------------------------

  OPERATION:
    value: "list_products"
    description: "Operation to perform"
    options:
      # Product operations
      - "list_products"
      - "get_product"
      - "create_product"
      - "update_product"
      - "delete_product"
      # API association
      - "list_product_apis"
      - "add_api_to_product"
      - "remove_api_from_product"
      # Policy operations
      - "get_product_policy"
      - "set_product_policy"
      - "clear_product_policy"
      # Group operations (visibility)
      - "list_product_groups"
      - "add_group_to_product"
      - "remove_group_from_product"
      # Subscription operations
      - "list_product_subscriptions"
      - "create_product_subscription"
      - "delete_product_subscription"

  PRODUCT_TYPE:
    value: "internal"
    description: "Product type - vendor products get 'vendor-' prefix and 'Vendor: ' display name"
    options:
      - "internal"
      - "vendor"

  PRODUCT_NAME:
    value: ""
    description: "Product name/ID - auto-derived from display name for create, required for other operations"

  PRODUCT_DISPLAY_NAME:
    value: ""
    description: "Product display name (e.g., 'Starter Plan', 'Premium Plan')"

  PRODUCT_DESCRIPTION:
    value: ""
    description: "Product description"

  # PRODUCT_STATE:
  #   value: "published"
  #   description: "Product state"
  #   options:
  #     - "published"
  #     - "notPublished"

  # SUBSCRIPTION_REQUIRED:
  #   value: "true"
  #   description: "Whether subscription is required to access APIs"
  #   options:
  #     - "true"
  #     - "false"

  # APPROVAL_REQUIRED:
  #   value: "false"
  #   description: "Whether subscription approval is required"
  #   options:
  #     - "true"
  #     - "false"

  # SUBSCRIPTIONS_LIMIT:
  #   value: ""
  #   description: "Maximum number of subscriptions (leave empty for unlimited)"

  # TERMS_OF_USE:
  #   value: ""
  #   description: "Terms of use for the product"

  API_NAME:
    value: ""
    description: "API name/ID to add/remove from product"

  POLICY_FILE_PATH:
    value: ""
    description: "Path to policy XML in policy repo (for set_product_policy)"

  # -----------------------------------------------
  # Group Management (visibility)
  # -----------------------------------------------
  # GROUP_NAME:
  #   value: ""
  #   description: "Group name to add/remove from product (e.g., 'developers', 'guests', 'administrators')"

  # -----------------------------------------------
  # Subscription Management
  # -----------------------------------------------
  SUBSCRIPTION_NAME:
    value: ""
    description: "Display name for the subscription (for create_product_subscription)"

  SUBSCRIPTION_ID:
    value: ""
    description: "Subscription ID (for delete_product_subscription)"

  SUBSCRIPTION_STATE:
    value: "active"
    description: "Subscription state"
    options:
      - "active"
      - "suspended"
      - "cancelled"

  DEBUG_MODE:
    value: "false"
    description: "Enable debug/verbose output for troubleshooting"
    options:
      - "false"
      - "true"

  # Policy repo defaults
  POLICY_REPO_BRANCH: "main"
  POLICY_CLONE_DIR: "apim-policies"
  PRODUCT_STATE: "published"
  SUBSCRIPTION_REQUIRED: "true"
  APPROVAL_REQUIRED: "false"
  SUBSCRIPTIONS_LIMIT: ""
  TERMS_OF_USE: ""
  GROUP_NAME: "developers"
# ============================================
# Stages
# ============================================
stages:
  - list
  - validate
  - backup
  - plan
  - notify
  - deploy

# ============================================
# Logging Functions
# ============================================
.logging_functions: &logging_functions
  - |
    log_info()  { echo "[INFO]  $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
    log_warn()  { echo "[WARN]  $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
    log_error() { echo "[ERROR] $(date -u +%Y-%m-%dT%H:%M:%SZ) $*" >&2; }
    log_ok()    { echo "[OK]    $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
    log_debug() { [ "$DEBUG_MODE" = "true" ] && echo "[DEBUG] $(date -u +%Y-%m-%dT%H:%M:%SZ) $*" || true; }

    # Debug mode controls verbose logging output
    if [ "$DEBUG_MODE" = "true" ]; then
      log_info "Debug mode enabled - verbose logging active"
    fi

# ============================================
# Audit Functions
# ============================================
.audit_functions: &audit_functions
  - |
    AUDIT_LOG_FILE="${CI_PROJECT_DIR}/audit-${CI_PIPELINE_ID}.json"

    # Initialize audit log as empty JSON array if it doesn't exist
    if [ ! -f "$AUDIT_LOG_FILE" ]; then
      echo "[]" > "$AUDIT_LOG_FILE"
    fi

    log_audit() {
      local action="$1"
      local resource="$2"
      local details="${3:-}"

      local audit_entry=$(jq -n \
        --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --arg pipeline_id "${CI_PIPELINE_ID}" \
        --arg job_id "${CI_JOB_ID}" \
        --arg job_name "${CI_JOB_NAME}" \
        --arg triggered_by "${GITLAB_USER_LOGIN:-unknown}" \
        --arg action "${action}" \
        --arg resource "${resource}" \
        --arg environment "${ENV_NAME:-unknown}" \
        --arg apim_service "${APIM_SERVICE:-unknown}" \
        --arg details "${details}" \
        --arg branch "${CI_COMMIT_BRANCH}" \
        --arg commit_sha "${CI_COMMIT_SHA}" \
        '{
          timestamp: $timestamp,
          pipeline_id: $pipeline_id,
          job_id: $job_id,
          job_name: $job_name,
          triggered_by: $triggered_by,
          action: $action,
          resource: $resource,
          environment: $environment,
          apim_service: $apim_service,
          details: $details,
          branch: $branch,
          commit_sha: $commit_sha
        }')

      # Append entry to JSON array
      jq --argjson entry "$audit_entry" '. += [$entry]' "$AUDIT_LOG_FILE" > "${AUDIT_LOG_FILE}.tmp" && mv "${AUDIT_LOG_FILE}.tmp" "$AUDIT_LOG_FILE"
      log_info "AUDIT: action=$action resource=$resource"
    }

# ============================================
# Set Environment Based on Branch
# ============================================
.set_environment: &set_environment
  - |
    case "$CI_COMMIT_BRANCH" in
      dev|develop)
        export ENV_NAME="dev"
        export AZ_SPN_CLIENT_ID="$DEV_AZ_SPN_CLIENT_ID"
        export AZ_SPN_CLIENT_SECRET="$DEV_AZ_SPN_CLIENT_SECRET"
        export AZ_SUBSCRIPTION_ID="$DEV_AZ_SUBSCRIPTION_ID"
        export RESOURCE_GROUP="$DEV_RESOURCE_GROUP"
        export APIM_SERVICE="$DEV_APIM_SERVICE"
        ;;
      tst|test)
        export ENV_NAME="tst"
        export AZ_SPN_CLIENT_ID="$TST_AZ_SPN_CLIENT_ID"
        export AZ_SPN_CLIENT_SECRET="$TST_AZ_SPN_CLIENT_SECRET"
        export AZ_SUBSCRIPTION_ID="$TST_AZ_SUBSCRIPTION_ID"
        export RESOURCE_GROUP="$TST_RESOURCE_GROUP"
        export APIM_SERVICE="$TST_APIM_SERVICE"
        ;;
      stg|staging)
        export ENV_NAME="stg"
        export AZ_SPN_CLIENT_ID="$STG_AZ_SPN_CLIENT_ID"
        export AZ_SPN_CLIENT_SECRET="$STG_AZ_SPN_CLIENT_SECRET"
        export AZ_SUBSCRIPTION_ID="$STG_AZ_SUBSCRIPTION_ID"
        export RESOURCE_GROUP="$STG_RESOURCE_GROUP"
        export APIM_SERVICE="$STG_APIM_SERVICE"
        ;;
      prd|main)
        export ENV_NAME="prd"
        export AZ_SPN_CLIENT_ID="$PRD_AZ_SPN_CLIENT_ID"
        export AZ_SPN_CLIENT_SECRET="$PRD_AZ_SPN_CLIENT_SECRET"
        export AZ_SUBSCRIPTION_ID="$PRD_AZ_SUBSCRIPTION_ID"
        export RESOURCE_GROUP="$PRD_RESOURCE_GROUP"
        export APIM_SERVICE="$PRD_APIM_SERVICE"
        ;;
      *)
        log_error "Unsupported branch: $CI_COMMIT_BRANCH"
        log_error "Use: dev/develop, tst/test, stg/staging, or prd/main"
        exit 1
        ;;
    esac
    log_info "Environment: $ENV_NAME"
    log_info "APIM Service: $APIM_SERVICE"

# ============================================
# Azure Login
# ============================================
.azure_login: &azure_login
  - |
    log_info "Logging into Azure..."
    if [ -z "$AZ_SPN_CLIENT_ID" ] || [ -z "$AZ_SPN_CLIENT_SECRET" ] || [ -z "$AZ_TENANT_ID" ]; then
      log_error "Missing Azure credentials for environment $ENV_NAME"
      exit 1
    fi

    az login --service-principal \
      --username "$AZ_SPN_CLIENT_ID" \
      --password "$AZ_SPN_CLIENT_SECRET" \
      --tenant "$AZ_TENANT_ID" \
      --output none

    az account set --subscription "$AZ_SUBSCRIPTION_ID"
    log_ok "Azure login successful"

# ============================================
# Build API URLs
# ============================================
.build_api_urls: &build_api_urls
  - |
    export APIM_BASE_URL="https://management.azure.com/subscriptions/${AZ_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.ApiManagement/service/${APIM_SERVICE}"
    export PRODUCTS_URL="${APIM_BASE_URL}/products?api-version=${AZURE_API_VERSION}"
    log_info "APIM Base URL configured"

# ============================================
# Clone Policy Repository
# ============================================
.clone_policy_repo: &clone_policy_repo
  - |
    log_info "Cloning policy repository..."
    set +x
    if echo "$POLICY_REPO_URL" | grep -q "^https://"; then
      AUTH_URL=$(echo "$POLICY_REPO_URL" | sed "s|https://|https://${POLICY_REPO_USERNAME}:${POLICY_REPO_TOKEN}@|")
    else
      AUTH_URL="https://${POLICY_REPO_USERNAME}:${POLICY_REPO_TOKEN}@${POLICY_REPO_URL}"
    fi
    rm -rf "$POLICY_CLONE_DIR"
    if ! git clone --depth 1 --branch "$POLICY_REPO_BRANCH" "$AUTH_URL" "$POLICY_CLONE_DIR" 2>/dev/null; then
      log_error "Failed to clone policy repository"
      exit 1
    fi
    set -x
    log_ok "Policy repository cloned successfully"

# ============================================
# Stage: List (read-only operations)
# ============================================
list_products:
  stage: list
  image: $IMAGE_AZURE_CLI
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "list_products"
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
  script:
    - |
      log_info "=========================================="
      log_info "Products in $APIM_SERVICE"
      log_info "=========================================="

      log_debug "Fetching product list from $APIM_SERVICE"
      PRODUCT_LIST=$(az apim product list \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --output json 2>&1)

      if echo "$PRODUCT_LIST" | jq -e '.' > /dev/null 2>&1; then
        echo ""
        echo "ID | Display Name | State | Subscription Required"
        echo "---|--------------|-------|----------------------"
        echo "$PRODUCT_LIST" | jq -r '.[] | "\(.name) | \(.displayName) | \(.state) | \(.subscriptionRequired)"'
        echo ""
        log_ok "Found $(echo "$PRODUCT_LIST" | jq 'length') products"
      else
        log_error "Failed to list products"
        echo "$PRODUCT_LIST"
        exit 1
      fi

get_product:
  stage: list
  image: $IMAGE_AZURE_CLI
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "get_product"
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
  script:
    - |
      log_info "=========================================="
      log_info "Getting Product: $PRODUCT_NAME"
      log_info "=========================================="

      if [ -z "$PRODUCT_NAME" ]; then
        log_error "PRODUCT_NAME is required"
        exit 1
      fi

      log_debug "Fetching product details for $PRODUCT_NAME"
      PRODUCT_DETAILS=$(az apim product show \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --product-id "$PRODUCT_NAME" \
        --output json 2>&1)

      if echo "$PRODUCT_DETAILS" | jq -e '.name' > /dev/null 2>&1; then
        log_ok "Product retrieved successfully"
        echo ""
        echo "$PRODUCT_DETAILS" | jq '{
          id: .name,
          displayName: .displayName,
          description: .description,
          state: .state,
          subscriptionRequired: .subscriptionRequired,
          approvalRequired: .approvalRequired,
          subscriptionsLimit: .subscriptionsLimit,
          terms: .terms
        }'
      else
        log_error "Product not found: $PRODUCT_NAME"
        echo "$PRODUCT_DETAILS"
        exit 1
      fi

list_product_apis:
  stage: list
  image: $IMAGE_AZURE_CLI
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "list_product_apis"
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
  script:
    - |
      log_info "=========================================="
      log_info "APIs in Product: $PRODUCT_NAME"
      log_info "=========================================="

      if [ -z "$PRODUCT_NAME" ]; then
        log_error "PRODUCT_NAME is required"
        exit 1
      fi

      log_debug "Fetching APIs for product $PRODUCT_NAME"
      API_LIST=$(az apim product api list \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --product-id "$PRODUCT_NAME" \
        --output json 2>&1)

      if echo "$API_LIST" | jq -e '.' > /dev/null 2>&1; then
        echo ""
        echo "API ID | Display Name | Path"
        echo "-------|--------------|-----"
        echo "$API_LIST" | jq -r '.[] | "\(.name) | \(.displayName) | \(.path)"'
        echo ""
        log_ok "Found $(echo "$API_LIST" | jq 'length') APIs in product"
      else
        log_error "Failed to list product APIs"
        echo "$API_LIST"
        exit 1
      fi

get_product_policy:
  stage: list
  image: $IMAGE_AZURE_CLI
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "get_product_policy"
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  script:
    - |
      log_info "=========================================="
      log_info "Getting Product Policy: $PRODUCT_NAME"
      log_info "=========================================="

      if [ -z "$PRODUCT_NAME" ]; then
        log_error "PRODUCT_NAME is required"
        exit 1
      fi

      POLICY_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/policies/policy?api-version=${AZURE_API_VERSION}"

      log_info "URL: $POLICY_URL"

      # Fetch policy - capture exit code separately
      HTTP_RESPONSE=$(az rest --method GET \
        --url "$POLICY_URL" \
        --headers "Content-Type=application/json" \
        --output json 2>&1) && REST_EXIT_CODE=$? || REST_EXIT_CODE=$?

      log_debug "Exit code: $REST_EXIT_CODE"
      log_debug "Response: $HTTP_RESPONSE"

      if [ $REST_EXIT_CODE -ne 0 ]; then
        # Check if it's a 404 (policy not found)
        if echo "$HTTP_RESPONSE" | grep -qi "ResourceNotFound\|NotFound\|404"; then
          echo ""
          echo "=========================================="
          echo "  No policy configured for: $PRODUCT_NAME"
          echo "=========================================="
          echo ""
          echo "  This product is using the default policy."
          echo "  Use 'set_product_policy' to add a custom policy."
          echo ""
        else
          log_error "Failed to get product policy"
          log_error "Response: $HTTP_RESPONSE"
          exit 1
        fi
      elif echo "$HTTP_RESPONSE" | jq -e '.properties.value' > /dev/null 2>&1; then
        log_ok "Product policy retrieved successfully"
        echo ""
        echo "=========================================="
        echo "  Policy for: $PRODUCT_NAME"
        echo "=========================================="
        echo ""
        echo "$HTTP_RESPONSE" | jq -r '.properties.value'
        echo ""
      else
        echo ""
        echo "=========================================="
        echo "  No policy configured for: $PRODUCT_NAME"
        echo "=========================================="
        echo ""
        echo "  This product is using the default policy."
        echo "  Use 'set_product_policy' to add a custom policy."
        echo ""
      fi

list_product_groups:
  stage: list
  image: $IMAGE_AZURE_CLI
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "list_product_groups"
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  script:
    - |
      log_info "=========================================="
      log_info "Groups for Product: $PRODUCT_NAME"
      log_info "=========================================="

      if [ -z "$PRODUCT_NAME" ]; then
        log_error "PRODUCT_NAME is required"
        exit 1
      fi

      GROUPS_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/groups?api-version=${AZURE_API_VERSION}"

      log_debug "Fetching groups from: $GROUPS_URL"
      HTTP_RESPONSE=$(az rest --method GET \
        --url "$GROUPS_URL" \
        --headers "Content-Type=application/json" \
        --output json 2>&1)

      if echo "$HTTP_RESPONSE" | jq -e '.value' > /dev/null 2>&1; then
        echo ""
        echo "Group ID | Display Name | Type | Built-in"
        echo "---------|--------------|------|----------"
        echo "$HTTP_RESPONSE" | jq -r '.value[] | "\(.name) | \(.properties.displayName) | \(.properties.type) | \(.properties.builtIn)"'
        echo ""
        log_ok "Found $(echo "$HTTP_RESPONSE" | jq '.value | length') groups"
      else
        log_warn "No groups found for product or product does not exist"
        echo "$HTTP_RESPONSE"
      fi

list_product_subscriptions:
  stage: list
  image: $IMAGE_AZURE_CLI
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "list_product_subscriptions"
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  script:
    - |
      log_info "=========================================="
      log_info "Subscriptions for Product: $PRODUCT_NAME"
      log_info "=========================================="

      if [ -z "$PRODUCT_NAME" ]; then
        log_error "PRODUCT_NAME is required"
        exit 1
      fi

      # List all subscriptions and filter by product scope
      SUBSCRIPTIONS_URL="${APIM_BASE_URL}/subscriptions?api-version=${AZURE_API_VERSION}"

      log_debug "Fetching subscriptions from: $SUBSCRIPTIONS_URL"
      HTTP_RESPONSE=$(az rest --method GET \
        --url "$SUBSCRIPTIONS_URL" \
        --headers "Content-Type=application/json" \
        --output json 2>&1)

      if echo "$HTTP_RESPONSE" | jq -e '.value' > /dev/null 2>&1; then
        echo ""
        echo "Subscription ID | Display Name | State | Created Date"
        echo "----------------|--------------|-------|-------------"
        echo "$HTTP_RESPONSE" | jq -r --arg pid "$PRODUCT_NAME" '.value[] | select(.properties.scope | contains("/products/" + $pid)) | "\(.name) | \(.properties.displayName) | \(.properties.state) | \(.properties.createdDate)"'
        echo ""
        SUBSCRIPTION_COUNT=$(echo "$HTTP_RESPONSE" | jq -r --arg pid "$PRODUCT_NAME" '[.value[] | select(.properties.scope | contains("/products/" + $pid))] | length')
        log_ok "Found $SUBSCRIPTION_COUNT subscriptions for product"
      else
        log_warn "Failed to list subscriptions"
        echo "$HTTP_RESPONSE"
      fi

# ============================================
# Stage: Validate
# ============================================
validate_inputs:
  stage: validate
  image: $IMAGE_ALPINE
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION !~ /^(list_products|get_product|list_product_apis|get_product_policy|list_product_groups|list_product_subscriptions)$/
  script:
    - *logging_functions
    - |
      log_info "=========================================="
      log_info "Validating Pipeline Inputs"
      log_info "=========================================="
      echo "Operation: $OPERATION"
      echo "Branch: $CI_COMMIT_BRANCH"
      echo ""

      # Validate operation
      case "$OPERATION" in
        create_product|update_product|delete_product|add_api_to_product|remove_api_from_product|set_product_policy|clear_product_policy|add_group_to_product|remove_group_from_product|create_product_subscription|delete_product_subscription)
          log_ok "Valid operation: $OPERATION"
          ;;
        *)
          log_error "Invalid operation: $OPERATION"
          exit 1
          ;;
      esac

      # Validate required inputs per operation
      case "$OPERATION" in
        create_product)
          if [ -z "$PRODUCT_DISPLAY_NAME" ]; then
            log_error "PRODUCT_DISPLAY_NAME is required for create_product"
            exit 1
          fi
          # Warn if description is missing and set default
          if [ -z "$PRODUCT_DESCRIPTION" ]; then
            log_warn "PRODUCT_DESCRIPTION not provided - using default: [Automated Product]"
            echo "PRODUCT_DESCRIPTION=[Automated Product]" >> "$CI_PROJECT_DIR/product_defaults.env"
          fi
          # Show what the auto-derived PRODUCT_NAME will be if not provided
          if [ -z "$PRODUCT_NAME" ]; then
            DERIVED_NAME=$(echo "$PRODUCT_DISPLAY_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            if [ "$PRODUCT_TYPE" = "vendor" ]; then
              DERIVED_NAME="vendor-${DERIVED_NAME}"
            fi
            log_info "Product Name will be auto-derived: $DERIVED_NAME"
          else
            log_info "Product Name: $PRODUCT_NAME"
          fi
          log_info "Display Name: $PRODUCT_DISPLAY_NAME"
          log_info "Description: ${PRODUCT_DESCRIPTION:-[Automated Product]}"
          log_info "Subscription Required: $SUBSCRIPTION_REQUIRED"
          log_info "Approval Required: $APPROVAL_REQUIRED"
          ;;
        update_product)
          if [ -z "$PRODUCT_NAME" ]; then
            log_error "PRODUCT_NAME is required for $OPERATION"
            exit 1
          fi
          log_info "Product Name: $PRODUCT_NAME"
          [ -n "$PRODUCT_DISPLAY_NAME" ] && log_info "Display Name: $PRODUCT_DISPLAY_NAME"
          [ -n "$PRODUCT_DESCRIPTION" ] && log_info "Description: $PRODUCT_DESCRIPTION"
          log_info "State: $PRODUCT_STATE"
          log_info "Subscription Required: $SUBSCRIPTION_REQUIRED"
          log_info "Approval Required: $APPROVAL_REQUIRED"
          [ -n "$SUBSCRIPTIONS_LIMIT" ] && log_info "Subscriptions Limit: $SUBSCRIPTIONS_LIMIT"
          [ -n "$TERMS_OF_USE" ] && log_info "Terms of Use: (provided)"
          ;;
        delete_product|clear_product_policy)
          if [ -z "$PRODUCT_NAME" ]; then
            log_error "PRODUCT_NAME is required for $OPERATION"
            exit 1
          fi
          log_info "Product Name: $PRODUCT_NAME"
          ;;
        add_api_to_product|remove_api_from_product)
          if [ -z "$PRODUCT_NAME" ]; then
            log_error "PRODUCT_NAME is required for $OPERATION"
            exit 1
          fi
          if [ -z "$API_NAME" ]; then
            log_error "API_NAME is required for $OPERATION"
            exit 1
          fi
          log_info "Product Name: $PRODUCT_NAME"
          log_info "API Name: $API_NAME"
          ;;
        set_product_policy)
          if [ -z "$PRODUCT_NAME" ]; then
            log_error "PRODUCT_NAME is required for set_product_policy"
            exit 1
          fi
          if [ -z "$POLICY_FILE_PATH" ]; then
            log_error "POLICY_FILE_PATH is required for set_product_policy"
            exit 1
          fi
          log_info "Product Name: $PRODUCT_NAME"
          log_info "Policy File: $POLICY_FILE_PATH"
          ;;
        add_group_to_product|remove_group_from_product)
          if [ -z "$PRODUCT_NAME" ]; then
            log_error "PRODUCT_NAME is required for $OPERATION"
            exit 1
          fi
          if [ -z "$GROUP_NAME" ]; then
            log_error "GROUP_NAME is required for $OPERATION"
            exit 1
          fi
          log_info "Product Name: $PRODUCT_NAME"
          log_info "Group Name: $GROUP_NAME"
          ;;
        create_product_subscription)
          if [ -z "$PRODUCT_NAME" ]; then
            log_error "PRODUCT_NAME is required for create_product_subscription"
            exit 1
          fi
          if [ -z "$SUBSCRIPTION_NAME" ]; then
            log_error "SUBSCRIPTION_NAME is required for create_product_subscription"
            exit 1
          fi
          log_info "Product Name: $PRODUCT_NAME"
          log_info "Subscription Name: $SUBSCRIPTION_NAME"
          log_info "Subscription State: $SUBSCRIPTION_STATE"
          ;;
        delete_product_subscription)
          if [ -z "$SUBSCRIPTION_ID" ]; then
            log_error "SUBSCRIPTION_ID is required for delete_product_subscription"
            exit 1
          fi
          log_info "Subscription ID: $SUBSCRIPTION_ID"
          ;;
      esac

      log_ok "All inputs validated successfully"

validate_policy:
  stage: validate
  image: $IMAGE_ALPINE
  needs: ["validate_inputs"]
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "set_product_policy"
  before_script:
    - apk add --no-cache git libxml2-utils
    - *logging_functions
    - *clone_policy_repo
  script:
    - |
      log_info "=========================================="
      log_info "Validating Policy XML"
      log_info "=========================================="

      POLICY_PATH="${POLICY_CLONE_DIR}/${POLICY_FILE_PATH}"

      if [ ! -f "$POLICY_PATH" ]; then
        log_error "Policy file not found: $POLICY_PATH"
        exit 1
      fi

      log_info "Policy file: $POLICY_PATH"

      # Validate XML syntax
      if xmllint --noout "$POLICY_PATH" 2>&1; then
        log_ok "XML syntax valid"
      else
        log_error "XML syntax validation failed"
        exit 1
      fi

      # Check for required elements
      if xmllint --xpath "/policies" "$POLICY_PATH" > /dev/null 2>&1; then
        log_ok "Root <policies> element found"
      else
        log_error "Missing root <policies> element"
        exit 1
      fi

      log_ok "Policy validation passed"

# ============================================
# Stage: Backup
# ============================================
backup_product:
  stage: backup
  image: $IMAGE_AZURE_CLI
  needs: ["validate_inputs"]
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION =~ /^(update_product|delete_product)$/
  before_script:
    - *logging_functions
    - *audit_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  script:
    - |
      log_info "=========================================="
      log_info "Backing Up Product: $PRODUCT_NAME"
      log_info "=========================================="

      BACKUP_FILE="${CI_PROJECT_DIR}/backup-product-${PRODUCT_NAME}-${ENV_NAME}-${CI_PIPELINE_ID}.json"
      PRODUCT_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}?api-version=${AZURE_API_VERSION}"

      log_debug "Backing up product from: $PRODUCT_URL"
      HTTP_RESPONSE=$(az rest --method GET \
        --url "$PRODUCT_URL" \
        --headers "Content-Type=application/json" \
        --output json 2>&1) || true

      if echo "$HTTP_RESPONSE" | jq -e '.id' > /dev/null 2>&1; then
        echo "$HTTP_RESPONSE" > "$BACKUP_FILE"
        log_ok "Backup saved to: $BACKUP_FILE"
        log_audit "backup_product" "$PRODUCT_NAME" "backup_file=$BACKUP_FILE"
      else
        log_warn "Product not found or could not be backed up"
        echo "{}" > "$BACKUP_FILE"
      fi
  artifacts:
    paths:
      - backup-product-*.json
      - audit-*.json
    expire_in: 90 days

backup_product_policy:
  stage: backup
  image: $IMAGE_AZURE_CLI
  needs: ["validate_inputs"]
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION =~ /^(set_product_policy|clear_product_policy)$/
  before_script:
    - *logging_functions
    - *audit_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  script:
    - |
      log_info "=========================================="
      log_info "Backing Up Product Policy: $PRODUCT_NAME"
      log_info "=========================================="

      BACKUP_FILE="${CI_PROJECT_DIR}/backup-product-policy-${PRODUCT_NAME}-${ENV_NAME}-${CI_PIPELINE_ID}.xml"
      POLICY_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/policies/policy?api-version=${AZURE_API_VERSION}"

      log_debug "Backing up policy from: $POLICY_URL"
      HTTP_RESPONSE=$(az rest --method GET \
        --url "$POLICY_URL" \
        --headers "Content-Type=application/json" \
        --output json 2>&1) || true

      if echo "$HTTP_RESPONSE" | jq -e '.properties.value' > /dev/null 2>&1; then
        echo "$HTTP_RESPONSE" | jq -r '.properties.value' > "$BACKUP_FILE"
        log_ok "Backup saved to: $BACKUP_FILE"
        log_audit "backup_product_policy" "$PRODUCT_NAME" "backup_file=$BACKUP_FILE"
      else
        log_warn "No existing policy to backup"
        echo "<!-- No policy configured -->" > "$BACKUP_FILE"
      fi
  artifacts:
    paths:
      - backup-product-policy-*.xml
      - audit-*.json
    expire_in: 90 days

# ============================================
# Stage: Plan
# ============================================
plan:
  stage: plan
  image: $IMAGE_AZURE_CLI
  needs:
    - job: validate_inputs
      optional: true
    - job: validate_policy
      optional: true
    - job: backup_product
      optional: true
    - job: backup_product_policy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION !~ /^(list_products|get_product|list_product_apis|get_product_policy|list_product_groups|list_product_subscriptions)$/
  before_script:
    - *logging_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  script:
    - |
      log_info "=========================================="
      log_info "Execution Plan"
      log_info "=========================================="
      echo ""
      echo "Operation:    $OPERATION"
      echo "Environment:  $ENV_NAME"
      echo "APIM Service: $APIM_SERVICE"
      echo ""

      case "$OPERATION" in
        create_product)
          # Calculate the product name that will be used
          if [ -z "$PRODUCT_NAME" ]; then
            PLAN_PRODUCT_NAME=$(echo "$PRODUCT_DISPLAY_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          else
            PLAN_PRODUCT_NAME="$PRODUCT_NAME"
          fi
          PLAN_DISPLAY_NAME="$PRODUCT_DISPLAY_NAME"
          if [ "$PRODUCT_TYPE" = "vendor" ]; then
            PLAN_PRODUCT_NAME="vendor-${PLAN_PRODUCT_NAME}"
            PLAN_DISPLAY_NAME="Vendor: ${PLAN_DISPLAY_NAME}"
          fi

          echo "Action: Create new product"
          echo ""
          echo "Product Configuration:"
          echo "  Product Name (ID):       $PLAN_PRODUCT_NAME"
          echo "  Display Name:            $PLAN_DISPLAY_NAME"
          echo "  Product Type:            $PRODUCT_TYPE"
          echo "  State:                   $PRODUCT_STATE"
          echo "  Subscription Required:   $SUBSCRIPTION_REQUIRED"
          echo "  Approval Required:       $APPROVAL_REQUIRED"
          [ -n "$SUBSCRIPTIONS_LIMIT" ] && echo "  Subscriptions Limit:     $SUBSCRIPTIONS_LIMIT"
          [ -n "$PRODUCT_DESCRIPTION" ] && echo "  Description:             $PRODUCT_DESCRIPTION"
          [ -n "$TERMS_OF_USE" ] && echo "  Terms of Use:            (provided)"
          ;;
        update_product)
          echo "Action: Update existing product"
          echo ""
          echo "Update Configuration:"
          echo "  Product Name (ID):       $PRODUCT_NAME"
          [ -n "$PRODUCT_DISPLAY_NAME" ] && echo "  New Display Name:        $PRODUCT_DISPLAY_NAME"
          [ -n "$PRODUCT_DESCRIPTION" ] && echo "  New Description:         $PRODUCT_DESCRIPTION"
          echo "  State:                   $PRODUCT_STATE"
          echo "  Subscription Required:   $SUBSCRIPTION_REQUIRED"
          echo "  Approval Required:       $APPROVAL_REQUIRED"
          [ -n "$SUBSCRIPTIONS_LIMIT" ] && echo "  Subscriptions Limit:     $SUBSCRIPTIONS_LIMIT"
          [ -n "$TERMS_OF_USE" ] && echo "  Terms of Use:            (provided)"
          ;;
        delete_product)
          echo "Action: DELETE product (DESTRUCTIVE)"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo ""
          echo "WARNING: This will permanently delete the product and all its associations!"
          ;;
        add_api_to_product)
          echo "Action: Add API to product"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo "  API Name (ID):           $API_NAME"
          ;;
        remove_api_from_product)
          echo "Action: Remove API from product"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo "  API Name (ID):           $API_NAME"
          ;;
        set_product_policy)
          echo "Action: Set product policy"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo "  Policy File:             $POLICY_FILE_PATH"
          ;;
        clear_product_policy)
          echo "Action: Clear/Remove product policy"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo ""
          echo "WARNING: This will remove the policy from the product!"
          ;;
        add_group_to_product)
          echo "Action: Add visibility group to product"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo "  Group Name:              $GROUP_NAME"
          ;;
        remove_group_from_product)
          echo "Action: Remove visibility group from product"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo "  Group Name:              $GROUP_NAME"
          ;;
        create_product_subscription)
          # Generate the subscription ID that will be used
          PLAN_SUB_ID="${PRODUCT_NAME}-sub-<timestamp>"
          echo "Action: Create subscription for product"
          echo ""
          echo "  Product Name (ID):       $PRODUCT_NAME"
          echo "  Subscription ID:         $PLAN_SUB_ID"
          echo "  Subscription Name:       $SUBSCRIPTION_NAME"
          echo "  Subscription State:      $SUBSCRIPTION_STATE"
          ;;
        delete_product_subscription)
          echo "Action: DELETE subscription (DESTRUCTIVE)"
          echo ""
          echo "  Subscription ID:         $SUBSCRIPTION_ID"
          echo ""
          echo "WARNING: This will permanently delete the subscription!"
          ;;
      esac

      echo ""
      log_info "Plan complete. Approve deploy job to execute."

# ============================================
# Stage: Notify (send approval notification emails)
# ============================================
notify_approvers:
  stage: notify
  image: $IMAGE_PYTHON
  needs: ["plan"]
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION =~ /^(create_product|update_product|delete_product|add_api_to_product|remove_api_from_product|set_product_policy|clear_product_policy|add_group_to_product|remove_group_from_product|create_product_subscription|delete_product_subscription)$/
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    paths:
      - .pip-cache/
  before_script:
    - pip install --quiet requests
    # Set APIM_SERVICE based on branch (for email notification)
    - |
      case "$CI_COMMIT_BRANCH" in
        dev|develop) export APIM_SERVICE="$DEV_APIM_SERVICE" ;;
        tst|test) export APIM_SERVICE="$TST_APIM_SERVICE" ;;
        stg|staging) export APIM_SERVICE="$STG_APIM_SERVICE" ;;
        prd|main) export APIM_SERVICE="$PRD_APIM_SERVICE" ;;
      esac
  script:
    - |
      cat > /tmp/notify_approvers.py << 'PYTHON_SCRIPT'
      #!/usr/bin/env python3
      """Send approval notification emails to protected environment approvers."""

      import os
      import sys
      import smtplib
      from email.mime.text import MIMEText
      from email.mime.multipart import MIMEMultipart
      from email.utils import formataddr
      from datetime import datetime, timezone, timedelta

      try:
          import requests
      except ImportError:
          print("[ERROR] requests library not installed")
          sys.exit(1)

      def log_info(msg): print(f"[INFO]  {datetime.utcnow().isoformat()}Z - {msg}")
      def log_warn(msg): print(f"[WARN]  {datetime.utcnow().isoformat()}Z - {msg}")
      def log_error(msg): print(f"[ERROR] {datetime.utcnow().isoformat()}Z - {msg}", file=sys.stderr)

      class GitLabClient:
          def __init__(self, url, token):
              self.api_url = f"{url.rstrip('/')}/api/v4"
              self.headers = {'PRIVATE-TOKEN': token}

          def get(self, endpoint):
              r = requests.get(f"{self.api_url}/{endpoint}", headers=self.headers, timeout=30)
              r.raise_for_status()
              return r.json()

          def get_protected_env(self, project_id, env_name):
              return self.get(f"projects/{project_id}/protected_environments/{env_name}")

          def get_user(self, user_id):
              return self.get(f"users/{user_id}")

          def get_group_members(self, group_id):
              members = []
              page = 1
              while True:
                  result = self.get(f"groups/{group_id}/members/all?page={page}&per_page=100")
                  if not result: break
                  members.extend(result)
                  if len(result) < 100: break
                  page += 1
              return members

          def get_project_members(self, project_id, min_access_level=None):
              """Get project members, optionally filtered by minimum access level."""
              members = []
              page = 1
              endpoint = f"projects/{project_id}/members/all?page={page}&per_page=100"
              if min_access_level:
                  endpoint += f"&min_access_level={min_access_level}"
              while True:
                  result = self.get(endpoint)
                  if not result: break
                  members.extend(result)
                  if len(result) < 100: break
                  page += 1
                  endpoint = f"projects/{project_id}/members/all?page={page}&per_page=100"
                  if min_access_level:
                      endpoint += f"&min_access_level={min_access_level}"
              return members

      # GitLab access levels
      ACCESS_LEVEL_DEVELOPER = 30
      ACCESS_LEVEL_MAINTAINER = 40

      def get_env_from_branch(branch):
          return {'dev': 'dev', 'develop': 'dev', 'tst': 'tst', 'test': 'tst',
                  'stg': 'stg', 'staging': 'stg', 'prd': 'prd', 'main': 'prd'}.get(branch, 'dev')

      def get_excluded_emails():
          """Get list of emails to exclude from notifications (from SMTP_EXCLUDE_EMAILS env var)."""
          exclude_str = os.environ.get('SMTP_EXCLUDE_EMAILS', '')
          if not exclude_str:
              return []
          return [e.strip().lower() for e in exclude_str.split(',') if e.strip()]

      def is_excluded_email(email):
          """Check if email should be excluded from notifications."""
          if not email:
              return True
          email_lower = email.lower()
          # Exclude service account emails (group_*@lazard.com) by default
          if email_lower.startswith('group_'):
              return True
          # Check additional exclusions from SMTP_EXCLUDE_EMAILS
          excluded = get_excluded_emails()
          return email_lower in excluded

      def get_user_email(user, email_domain=None):
          """
          Try to get user email from various fields.
          GitLab API email visibility:
            - 'email': Only visible to admins
            - 'public_email': Only if user sets it in Profile settings
            - 'commit_email': User's commit email (may be private)
          Falls back to constructing email from username if domain provided.
          """
          # Try standard email fields
          email = user.get('email') or user.get('public_email') or user.get('commit_email')

          # Filter out GitLab's private commit email format
          if email and '@users.noreply' in email:
              email = None

          # Fallback: construct from username + domain
          if not email and email_domain:
              username = user.get('username')
              if username:
                  email = f"{username}@{email_domain}"

          return email

      def collect_approvers(gl, project_id, env_name, email_domain=None):
          approvers = {}
          try:
              env_config = gl.get_protected_env(project_id, env_name)
          except Exception as e:
              log_warn(f"Could not get protected environment: {e}")
              return approvers

          # Debug: show what we got from the API
          log_info(f"Protected environment config keys: {list(env_config.keys())}")

          # Only use approval_rules (not deploy_access_levels)
          approval_rules = env_config.get('approval_rules', [])
          log_info(f"Found {len(approval_rules)} approval_rules")

          if not approval_rules:
              log_warn("No approval_rules found in protected environment")
              log_warn("Add approvers in Settings > CI/CD > Protected Environments > [env] > Approvers")
              return approvers

          for access in approval_rules:
              user_id = access.get('user_id')
              group_id = access.get('group_id')
              access_level = access.get('access_level')

              log_info(f"Processing approval rule: user_id={user_id}, group_id={group_id}, access_level={access_level}")

              if user_id:
                  # Specific user approver
                  try:
                      user = gl.get_user(user_id)
                      email = get_user_email(user, email_domain)
                      log_info(f"User {user_id} ({user.get('username')}): resolved email={email}")
                      if email and not is_excluded_email(email):
                          approvers[email] = user.get('name', 'Unknown')
                      elif not email:
                          log_warn(f"User {user_id} ({user.get('name')}, @{user.get('username')}) - no email found")
                          log_warn(f"  User should set public email in GitLab Profile, or set EMAIL_DOMAIN variable")
                  except Exception as e:
                      log_warn(f"Could not get user {user_id}: {e}")
              elif group_id:
                  # Group approvers - include all members of the group
                  try:
                      members = gl.get_group_members(group_id)
                      log_info(f"Approver group {group_id} has {len(members)} members")
                      for member in members:
                          email = get_user_email(member, email_domain)
                          if email and not is_excluded_email(email):
                              approvers[email] = member.get('name', 'Unknown')
                          elif not email:
                              log_warn(f"Group member @{member.get('username')} ({member.get('name')}) - no email found")
                  except Exception as e:
                      log_warn(f"Could not get group {group_id} members: {e}")
              elif access_level:
                  # Role-based approvers (e.g., all maintainers)
                  try:
                      members = gl.get_project_members(project_id, min_access_level=access_level)
                      log_info(f"Found {len(members)} project members with access_level >= {access_level}")
                      for member in members:
                          if member.get('access_level', 0) >= access_level:
                              email = get_user_email(member, email_domain)
                              if email and not is_excluded_email(email):
                                  approvers[email] = member.get('name', 'Unknown')
                              elif not email:
                                  log_warn(f"Project member @{member.get('username')} ({member.get('name')}) - no email found")
                  except Exception as e:
                      log_warn(f"Could not get project members for access_level {access_level}: {e}")

          return approvers

      def get_fallback_approvers():
          """Get approvers from APPROVER_EMAILS environment variable."""
          approver_emails = os.environ.get('APPROVER_EMAILS', '')
          if not approver_emails:
              return {}
          approvers = {}
          for email in approver_emails.split(','):
              email = email.strip()
              if email:
                  # Use email prefix as name if no name provided
                  name = email.split('@')[0].replace('.', ' ').replace('_', ' ').title()
                  approvers[email] = name
          return approvers

      def build_file_url(repo_url, branch, file_path):
          if not repo_url or not file_path: return None
          return f"{repo_url.rstrip('/').rstrip('.git')}/-/blob/{branch}/{file_path}"

      def send_email(smtp_host, smtp_port, from_addr, from_name, to_emails, subject, html, text):
          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = formataddr((from_name, from_addr)) if from_name else from_addr
          msg['To'] = ', '.join(to_emails)
          msg.attach(MIMEText(text, 'plain'))
          msg.attach(MIMEText(html, 'html'))

          try:
              with smtplib.SMTP(smtp_host, smtp_port, timeout=30) as server:
                  server.sendmail(from_addr, to_emails, msg.as_string())
              return True
          except Exception as e:
              log_error(f"SMTP error: {e}")
              return False

      def main():
          gitlab_url = os.environ.get('GITLAB_URL') or os.environ.get('CI_SERVER_URL')
          gitlab_token = os.environ.get('GITLAB_TOKEN')
          smtp_host = os.environ.get('SMTP_HOST')
          smtp_from = os.environ.get('SMTP_FROM')
          smtp_from_name = os.environ.get('SMTP_FROM_NAME', '')
          smtp_port = int(os.environ.get('SMTP_PORT', '25'))
          approver_emails_fallback = os.environ.get('APPROVER_EMAILS', '')

          # Check minimum requirements
          if not smtp_host or not smtp_from:
              log_warn("Missing SMTP_HOST or SMTP_FROM - skipping notification")
              return

          if not gitlab_token and not approver_emails_fallback:
              log_warn("Missing both GITLAB_TOKEN and APPROVER_EMAILS - skipping notification")
              log_warn("Set GITLAB_TOKEN (with read_api scope, Maintainer access) or APPROVER_EMAILS")
              return

          project_id = os.environ.get('CI_PROJECT_ID')
          branch = os.environ.get('CI_COMMIT_BRANCH', 'main')
          env_name = get_env_from_branch(branch)

          approvers = {}

          # EMAIL_DOMAIN allows constructing email from username (default: lazard.com)
          email_domain = os.environ.get('EMAIL_DOMAIN', 'lazard.com')
          log_info(f"Email domain: {email_domain} (emails constructed as username@{email_domain})")

          # Try to get approvers from GitLab API first
          if gitlab_token and gitlab_url:
              log_info(f"Collecting approvers for environment: {env_name}")
              gl = GitLabClient(gitlab_url, gitlab_token)
              approvers = collect_approvers(gl, project_id, env_name, email_domain or None)

          # Fallback to APPROVER_EMAILS if API failed or returned no approvers
          if not approvers and approver_emails_fallback:
              log_info("Using APPROVER_EMAILS fallback")
              approvers = get_fallback_approvers()

          if not approvers:
              log_warn("No approvers found - skipping notification")
              log_warn("Either fix GITLAB_TOKEN permissions or set APPROVER_EMAILS variable")
              return

          log_info(f"Found {len(approvers)} approvers")

          # Build context
          operation = os.environ.get('OPERATION', 'Unknown')
          pipeline_url = os.environ.get('CI_PIPELINE_URL', '')
          project_name = os.environ.get('CI_PROJECT_NAME', 'APIM')
          triggered_by = os.environ.get('GITLAB_USER_NAME', 'Unknown')
          policy_file = os.environ.get('POLICY_FILE_PATH', '')
          product_id = os.environ.get('PRODUCT_NAME', '')
          lob = os.environ.get('CI_PROJECT_ROOT_NAMESPACE', 'Unknown')
          apim_instance = os.environ.get('APIM_SERVICE', 'Unknown')

          # Timestamp in Eastern Time (New York)
          eastern = timezone(timedelta(hours=-5))  # EST (adjust for DST if needed)
          now_eastern = datetime.now(eastern)
          timestamp = now_eastern.strftime('%Y-%m-%d %I:%M:%S %p ET')

          # Risk indicator for destructive operations
          destructive_ops = ['delete_product', 'clear_product_policy', 'remove_api_from_product', 'remove_group_from_product', 'delete_product_subscription']
          is_destructive = operation in destructive_ops

          policy_url = build_file_url(os.environ.get('POLICY_REPO_URL'), os.environ.get('POLICY_REPO_BRANCH', 'main'), policy_file)

          details = []
          if product_id: details.append(f"<tr><td><b>Product ID:</b></td><td>{product_id}</td></tr>")
          if policy_file:
              link = f'<a href="{policy_url}">{policy_file}</a>' if policy_url else policy_file
              details.append(f"<tr><td><b>Policy File:</b></td><td>{link}</td></tr>")

          env_color = {'prd': '#dc3545', 'stg': '#fd7e14', 'tst': '#17a2b8', 'dev': '#28a745'}.get(env_name, '#6c757d')

          risk_banner = '''<div style="background: #dc3545; color: white; padding: 12px 20px; margin-bottom: 15px; border-radius: 4px;">
          <strong>⚠️ DESTRUCTIVE OPERATION</strong> - This action will permanently delete or clear resources. Please review carefully.
          </div>''' if is_destructive else ''

          html = f'''<!DOCTYPE html><html><head><style>
          body {{ font-family: sans-serif; }}
          .header {{ background: #1f75cb; color: white; padding: 20px; }}
          .content {{ padding: 20px; background: #f5f5f5; }}
          .details {{ background: white; padding: 15px; margin: 15px 0; }}
          .details td {{ padding: 5px 10px; }}
          .btn {{ background: #1f75cb; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; }}
          .env {{ background: {env_color}; color: white; padding: 2px 8px; font-size: 12px; }}
          .lob {{ background: #6f42c1; color: white; padding: 2px 8px; font-size: 12px; }}
          .risk {{ background: #dc3545; color: white; padding: 2px 8px; font-size: 12px; }}
          .timestamp {{ color: #666; font-size: 12px; }}
          </style></head><body>
          <div class="header"><h2>Pipeline Approval Required</h2><span class="timestamp">Requested: {timestamp}</span></div>
          <div class="content">
          {risk_banner}
          <p>A pipeline needs your approval to deploy to <span class="env">{env_name.upper()}</span></p>
          <div class="details"><table>
          <tr><td><b>LOB:</b></td><td><span class="lob">{lob.upper()}</span></td></tr>
          <tr><td><b>APIM Instance:</b></td><td><code>{apim_instance}</code></td></tr>
          <tr><td><b>Project:</b></td><td>{project_name}</td></tr>
          <tr><td><b>Operation:</b></td><td><code>{operation}</code>{' <span class="risk">DESTRUCTIVE</span>' if is_destructive else ''}</td></tr>
          <tr><td><b>Environment:</b></td><td>{env_name}</td></tr>
          <tr><td><b>Triggered by:</b></td><td>{triggered_by}</td></tr>
          <tr><td><b>Requested at:</b></td><td>{timestamp}</td></tr>
          {''.join(details)}
          </table></div>
          <p><a href="{pipeline_url}" class="btn">Review Pipeline</a></p>
          </div></body></html>'''

          text = f'''PIPELINE APPROVAL REQUIRED
          {"⚠️  DESTRUCTIVE OPERATION - This action will permanently delete or clear resources!" if is_destructive else ""}

          LOB: {lob.upper()}
          APIM Instance: {apim_instance}
          Project: {project_name}
          Operation: {operation} {"[DESTRUCTIVE]" if is_destructive else ""}
          Environment: {env_name}
          Triggered by: {triggered_by}
          Requested at: {timestamp}
          {"Product ID: " + product_id if product_id else ""}
          {"Policy File: " + policy_file if policy_file else ""}

          Review: {pipeline_url}'''

          lob_prefix = f"[{lob.upper()}]" if lob and lob != 'Unknown' else "[APIM]"
          env_label = "PRODUCTION" if env_name == 'prd' else env_name.upper()
          subject = f"{lob_prefix} [{env_label}] Approval Required: {operation}"

          if send_email(smtp_host, smtp_port, smtp_from, smtp_from_name, list(approvers.keys()), subject, html, text):
              log_info("Notification emails sent successfully")
              for email, name in approvers.items():
                  log_info(f"  - {name} <{email}>")
          else:
              log_error("Failed to send notification emails")

      if __name__ == '__main__':
          main()
      PYTHON_SCRIPT

      python /tmp/notify_approvers.py
  allow_failure: true  # Don't block pipeline if notification fails

# ============================================
# Deploy Base Templates
# ============================================
.deploy_base:
  stage: deploy
  image: $IMAGE_AZURE_CLI
  timeout: 15 minutes
  before_script:
    - *logging_functions
    - *audit_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
  artifacts:
    paths:
      - audit-*.json
    expire_in: 30 days

.deploy_base_with_policy:
  extends: .deploy_base
  before_script:
    - tdnf install -y git
    - *logging_functions
    - *audit_functions
    - *set_environment
    - *azure_login
    - *build_api_urls
    - *clone_policy_repo

# ============================================
# Script Templates
# ============================================
.create_product:
  script:
    - |
      log_info "=========================================="
      log_info "Creating Product"
      log_info "=========================================="

      # Derive PRODUCT_NAME from display name if not provided
      # Convert to lowercase, replace spaces and special chars with hyphens
      if [ -z "$PRODUCT_NAME" ]; then
        PRODUCT_NAME=$(echo "$PRODUCT_DISPLAY_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
        log_info "Derived Product ID: $PRODUCT_NAME"
      fi

      # Store original display name for logging
      ORIGINAL_DISPLAY_NAME="$PRODUCT_DISPLAY_NAME"

      # Apply vendor prefix if needed
      if [ "$PRODUCT_TYPE" = "vendor" ]; then
        PRODUCT_NAME="vendor-${PRODUCT_NAME}"
        PRODUCT_DISPLAY_NAME="Vendor: ${PRODUCT_DISPLAY_NAME}"
        log_info "Product Type: vendor (prefixes applied)"
      fi

      log_info "Product ID: $PRODUCT_NAME"
      log_info "Display Name: $PRODUCT_DISPLAY_NAME"

      # Set default description if not provided
      if [ -z "$PRODUCT_DESCRIPTION" ]; then
        PRODUCT_DESCRIPTION="[Automated Product]"
        log_warn "Using default description: $PRODUCT_DESCRIPTION"
      fi

      # Build command with required parameters
      CMD="az apim product create \
        --resource-group \"$RESOURCE_GROUP\" \
        --service-name \"$APIM_SERVICE\" \
        --product-id \"$PRODUCT_NAME\" \
        --product-name \"$PRODUCT_DISPLAY_NAME\" \
        --state \"$PRODUCT_STATE\" \
        --description \"$PRODUCT_DESCRIPTION\""

      # Handle boolean parameters - Azure CLI expects true/false as values
      if [ "$SUBSCRIPTION_REQUIRED" = "true" ]; then
        CMD="$CMD --subscription-required true"
      else
        CMD="$CMD --subscription-required false"
      fi

      if [ "$APPROVAL_REQUIRED" = "true" ]; then
        CMD="$CMD --approval-required true"
      else
        CMD="$CMD --approval-required false"
      fi

      if [ -n "$SUBSCRIPTIONS_LIMIT" ]; then
        CMD="$CMD --subscriptions-limit $SUBSCRIPTIONS_LIMIT"
      fi

      if [ -n "$TERMS_OF_USE" ]; then
        CMD="$CMD --legal-terms \"$TERMS_OF_USE\""
      fi

      CMD="$CMD --output json"

      log_debug "Executing: $CMD"
      RESULT=$(eval $CMD 2>&1)
      CREATE_EXIT_CODE=$?

      log_debug "Create command exit code: $CREATE_EXIT_CODE"

      if [ $CREATE_EXIT_CODE -eq 0 ] && echo "$RESULT" | jq -e '.name' > /dev/null 2>&1; then
        log_ok "Product created successfully"
        log_audit "create_product" "$PRODUCT_NAME" "display_name=$PRODUCT_DISPLAY_NAME"
        echo ""
        echo "Product Details:"
        echo "$RESULT" | jq '{id: .name, displayName: .displayName, state: .state}'

        # Add default groups (administrators and developers)
        log_info ""
        log_info "Adding default groups to product..."

        DEFAULT_GROUPS="administrators developers"
        for GROUP in $DEFAULT_GROUPS; do
          log_info "Adding group: $GROUP"
          GROUP_RESULT=$(az apim product group create \
            --resource-group "$RESOURCE_GROUP" \
            --service-name "$APIM_SERVICE" \
            --product-id "$PRODUCT_NAME" \
            --group-id "$GROUP" \
            --output json 2>&1) || true

          if echo "$GROUP_RESULT" | jq -e '.displayName' > /dev/null 2>&1; then
            log_ok "Group '$GROUP' added to product"
          elif echo "$GROUP_RESULT" | grep -qi "already exists\|conflict"; then
            log_info "Group '$GROUP' already associated with product"
          else
            log_warn "Could not add group '$GROUP': $GROUP_RESULT"
          fi
        done

        log_ok "Default groups configured"
      else
        log_error "Failed to create product"
        log_error "Error: $RESULT"
        exit 1
      fi

.update_product:
  script:
    - |
      log_info "=========================================="
      log_info "Updating Product: $PRODUCT_NAME"
      log_info "=========================================="

      # Get current product to use as defaults
      log_debug "Fetching current product: $PRODUCT_NAME"
      log_debug "Resource Group: $RESOURCE_GROUP"
      log_debug "APIM Service: $APIM_SERVICE"

      CURRENT=$(az apim product show \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --product-id "$PRODUCT_NAME" \
        --output json 2>&1)
      SHOW_EXIT_CODE=$?

      log_debug "Show command exit code: $SHOW_EXIT_CODE"

      if [ $SHOW_EXIT_CODE -ne 0 ] || ! echo "$CURRENT" | jq -e '.name' > /dev/null 2>&1; then
        log_error "Product not found or error retrieving product: $PRODUCT_NAME"
        log_error "Response: $CURRENT"
        exit 1
      fi

      # Use provided values or fall back to current values
      DISPLAY_NAME="${PRODUCT_DISPLAY_NAME:-$(echo "$CURRENT" | jq -r '.displayName')}"

      # Build the update command with required parameters
      CMD="az apim product update \
        --resource-group \"$RESOURCE_GROUP\" \
        --service-name \"$APIM_SERVICE\" \
        --product-id \"$PRODUCT_NAME\" \
        --product-name \"$DISPLAY_NAME\" \
        --state \"$PRODUCT_STATE\""

      # Handle boolean parameters
      if [ "$SUBSCRIPTION_REQUIRED" = "true" ]; then
        CMD="$CMD --subscription-required true"
      else
        CMD="$CMD --subscription-required false"
      fi

      if [ "$APPROVAL_REQUIRED" = "true" ]; then
        CMD="$CMD --approval-required true"
      else
        CMD="$CMD --approval-required false"
      fi

      # Add optional parameters if provided
      if [ -n "$PRODUCT_DESCRIPTION" ]; then
        CMD="$CMD --description \"$PRODUCT_DESCRIPTION\""
      fi

      if [ -n "$SUBSCRIPTIONS_LIMIT" ]; then
        CMD="$CMD --subscriptions-limit $SUBSCRIPTIONS_LIMIT"
      fi

      if [ -n "$TERMS_OF_USE" ]; then
        CMD="$CMD --legal-terms \"$TERMS_OF_USE\""
      fi

      CMD="$CMD --output json"

      log_debug "Updating product with:"
      log_debug "  Display Name: $DISPLAY_NAME"
      log_debug "  State: $PRODUCT_STATE"
      log_debug "  Subscription Required: $SUBSCRIPTION_REQUIRED"
      log_debug "  Approval Required: $APPROVAL_REQUIRED"
      [ -n "$PRODUCT_DESCRIPTION" ] && log_debug "  Description: $PRODUCT_DESCRIPTION"
      [ -n "$SUBSCRIPTIONS_LIMIT" ] && log_debug "  Subscriptions Limit: $SUBSCRIPTIONS_LIMIT"
      [ -n "$TERMS_OF_USE" ] && log_debug "  Terms of Use: (provided)"

      log_debug "Executing: $CMD"
      UPDATE_OUTPUT=$(eval $CMD 2>&1)
      UPDATE_EXIT_CODE=$?

      if [ $UPDATE_EXIT_CODE -eq 0 ]; then
        log_ok "Product updated successfully"
        log_audit "update_product" "$PRODUCT_NAME" "display_name=$DISPLAY_NAME"
        echo ""
        echo "Updated Product Details:"
        echo "$UPDATE_OUTPUT" | jq '{id: .name, displayName: .displayName, state: .state, subscriptionRequired: .subscriptionRequired, approvalRequired: .approvalRequired}'
      else
        log_error "Failed to update product"
        log_error "Error: $UPDATE_OUTPUT"
        exit 1
      fi

.delete_product:
  script:
    - |
      log_info "=========================================="
      log_info "Deleting Product: $PRODUCT_NAME"
      log_info "=========================================="

      log_debug "Deleting product: $PRODUCT_NAME"
      DELETE_OUTPUT=$(az apim product delete \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --product-id "$PRODUCT_NAME" \
        --delete-subscriptions true \
        --yes \
        --output none 2>&1)
      DELETE_EXIT_CODE=$?

      if [ $DELETE_EXIT_CODE -eq 0 ]; then
        log_ok "Product deleted successfully"
        log_audit "delete_product" "$PRODUCT_NAME" "status=deleted"
      else
        log_error "Failed to delete product"
        log_error "Error: $DELETE_OUTPUT"
        exit 1
      fi

.add_api_to_product:
  script:
    - |
      log_info "=========================================="
      log_info "Adding API to Product"
      log_info "Product: $PRODUCT_NAME | API: $API_NAME"
      log_info "=========================================="

      log_debug "Adding API $API_NAME to product $PRODUCT_NAME"
      log_debug "Resource Group: $RESOURCE_GROUP"
      log_debug "APIM Service: $APIM_SERVICE"
      
      # Execute command and capture both stdout and stderr
      set +e
      ADD_OUTPUT=$(az apim product api add \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --product-id "$PRODUCT_NAME" \
        --api-id "$API_NAME" \
        --output none 2>&1)
      ADD_EXIT_CODE=$?
      set -e

      log_debug "Command exit code: $ADD_EXIT_CODE"

      if [ $ADD_EXIT_CODE -eq 0 ]; then
        log_ok "API added to product successfully"
        log_audit "add_api_to_product" "$PRODUCT_NAME" "api_id=$API_NAME"
      else
        log_error "Failed to add API to product"
        log_error "Product ID: $PRODUCT_NAME"
        log_error "API ID: $API_NAME"
        echo ""
        echo "Error details:"
        echo "$ADD_OUTPUT"
        echo ""
        exit 1
      fi

.remove_api_from_product:
  script:
    - |
      log_info "=========================================="
      log_info "Removing API from Product"
      log_info "Product: $PRODUCT_NAME | API: $API_NAME"
      log_info "=========================================="

      log_debug "Removing API $API_NAME from product $PRODUCT_NAME"
      log_debug "Resource Group: $RESOURCE_GROUP"
      log_debug "APIM Service: $APIM_SERVICE"
      
      set +e
      REMOVE_OUTPUT=$(az apim product api delete \
        --resource-group "$RESOURCE_GROUP" \
        --service-name "$APIM_SERVICE" \
        --product-id "$PRODUCT_NAME" \
        --api-id "$API_NAME" \
        --output none 2>&1)
      REMOVE_EXIT_CODE=$?
      set -e

      log_debug "Command exit code: $REMOVE_EXIT_CODE"

      if [ $REMOVE_EXIT_CODE -eq 0 ]; then
        log_ok "API removed from product"
        log_audit "remove_api_from_product" "$PRODUCT_NAME" "api_id=$API_NAME"
      else
        log_error "Failed to remove API from product"
        log_error "Product ID: $PRODUCT_NAME"
        log_error "API ID: $API_NAME"
        echo ""
        echo "Error details:"
        echo "$REMOVE_OUTPUT"
        echo ""
        exit 1
      fi

.set_product_policy:
  script:
    - |
      log_info "=========================================="
      log_info "Setting Product Policy: $PRODUCT_NAME"
      log_info "=========================================="

      POLICY_PATH="${POLICY_CLONE_DIR}/${POLICY_FILE_PATH}"
      POLICY_CONTENT=$(cat "$POLICY_PATH")

      POLICY_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/policies/policy?api-version=${AZURE_API_VERSION}"

      REQUEST_BODY=$(jq -n \
        --arg policy "$POLICY_CONTENT" \
        '{
          "properties": {
            "format": "xml",
            "value": $policy
          }
        }')

      # Use --output none to avoid XML/JSON parsing issues
      log_debug "Setting policy at: $POLICY_URL"
      POLICY_OUTPUT=$(az rest --method PUT \
        --url "$POLICY_URL" \
        --headers "Content-Type=application/json" \
        --body "$REQUEST_BODY" \
        --output none 2>&1)
      POLICY_EXIT_CODE=$?

      if [ $POLICY_EXIT_CODE -eq 0 ]; then
        log_ok "Product policy set successfully"
        log_audit "set_product_policy" "$PRODUCT_NAME" "policy_file=$POLICY_FILE_PATH"
      else
        log_error "Failed to set product policy"
        log_error "Error: $POLICY_OUTPUT"
        exit 1
      fi

.clear_product_policy:
  script:
    - |
      log_info "=========================================="
      log_info "Clearing Product Policy: $PRODUCT_NAME"
      log_info "=========================================="

      POLICY_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/policies/policy?api-version=${AZURE_API_VERSION}"

      log_debug "Clearing policy at: $POLICY_URL"
      CLEAR_OUTPUT=$(az rest --method DELETE \
        --url "$POLICY_URL" \
        --headers "Content-Type=application/json" \
        --output none 2>&1)
      CLEAR_EXIT_CODE=$?

      if [ $CLEAR_EXIT_CODE -eq 0 ]; then
        log_ok "Product policy cleared"
        log_audit "clear_product_policy" "$PRODUCT_NAME" "status=cleared"
      else
        # Check if the error is "policy not found" which is acceptable
        if echo "$CLEAR_OUTPUT" | grep -qi "not found\|does not exist"; then
          log_warn "No policy found to clear (already empty)"
          log_audit "clear_product_policy" "$PRODUCT_NAME" "status=no_policy_found"
        else
          log_error "Failed to clear product policy"
          log_error "Error: $CLEAR_OUTPUT"
          exit 1
        fi
      fi

.add_group_to_product:
  script:
    - |
      log_info "=========================================="
      log_info "Adding Group to Product"
      log_info "Product: $PRODUCT_NAME | Group: $GROUP_NAME"
      log_info "=========================================="

      GROUP_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/groups/${GROUP_NAME}?api-version=${AZURE_API_VERSION}"

      # Use --output none to avoid XML/JSON parsing issues
      log_debug "Adding group at: $GROUP_URL"
      ADD_OUTPUT=$(az rest --method PUT \
        --url "$GROUP_URL" \
        --headers "Content-Type=application/json" \
        --output none 2>&1)
      ADD_EXIT_CODE=$?

      if [ $ADD_EXIT_CODE -eq 0 ]; then
        log_ok "Group added to product successfully"
        log_audit "add_group_to_product" "$PRODUCT_NAME" "group_name=$GROUP_NAME"
      else
        log_error "Failed to add group to product"
        log_error "Error: $ADD_OUTPUT"
        exit 1
      fi

.remove_group_from_product:
  script:
    - |
      log_info "=========================================="
      log_info "Removing Group from Product"
      log_info "Product: $PRODUCT_NAME | Group: $GROUP_NAME"
      log_info "=========================================="

      GROUP_URL="${APIM_BASE_URL}/products/${PRODUCT_NAME}/groups/${GROUP_NAME}?api-version=${AZURE_API_VERSION}"

      log_debug "Removing group at: $GROUP_URL"
      REMOVE_OUTPUT=$(az rest --method DELETE \
        --url "$GROUP_URL" \
        --headers "Content-Type=application/json" \
        --output none 2>&1)
      REMOVE_EXIT_CODE=$?

      if [ $REMOVE_EXIT_CODE -eq 0 ]; then
        log_ok "Group removed from product"
        log_audit "remove_group_from_product" "$PRODUCT_NAME" "group_name=$GROUP_NAME"
      else
        # Check if the error is "group not found" which is acceptable
        if echo "$REMOVE_OUTPUT" | grep -qi "not found\|does not exist"; then
          log_warn "Group not found on product (already removed)"
          log_audit "remove_group_from_product" "$PRODUCT_NAME" "group_name=$GROUP_NAME,status=not_found"
        else
          log_error "Failed to remove group from product"
          log_error "Error: $REMOVE_OUTPUT"
          exit 1
        fi
      fi

.create_product_subscription:
  script:
    - |
      log_info "=========================================="
      log_info "Creating Subscription for Product"
      log_info "Product: $PRODUCT_NAME | Name: $SUBSCRIPTION_NAME"
      log_info "=========================================="

      # Generate subscription ID from display name (lowercase, hyphenated)
      # Format: {product-id}-sub-{timestamp} to ensure uniqueness
      SUBSCRIPTION_ID="${PRODUCT_NAME}-sub-$(date +%s)"

      log_info "Generated subscription ID: $SUBSCRIPTION_ID"

      SUBSCRIPTION_URL="${APIM_BASE_URL}/subscriptions/${SUBSCRIPTION_ID}?api-version=${AZURE_API_VERSION}"

      # Build scope for product
      SCOPE="/subscriptions/${AZ_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.ApiManagement/service/${APIM_SERVICE}/products/${PRODUCT_NAME}"

      REQUEST_BODY=$(jq -n \
        --arg displayName "$SUBSCRIPTION_NAME" \
        --arg scope "$SCOPE" \
        --arg state "$SUBSCRIPTION_STATE" \
        '{
          "properties": {
            "displayName": $displayName,
            "scope": $scope,
            "state": $state
          }
        }')

      log_info "Creating subscription with scope: $SCOPE"

      log_debug "Creating subscription at: $SUBSCRIPTION_URL"
      log_debug "Request body: $REQUEST_BODY"
      CREATE_OUTPUT=$(az rest --method PUT \
        --url "$SUBSCRIPTION_URL" \
        --headers "Content-Type=application/json" \
        --body "$REQUEST_BODY" \
        --output none 2>&1)
      CREATE_EXIT_CODE=$?

      if [ $CREATE_EXIT_CODE -eq 0 ]; then
        log_ok "Subscription created successfully"
        log_audit "create_product_subscription" "$PRODUCT_NAME" "subscription_id=$SUBSCRIPTION_ID,name=$SUBSCRIPTION_NAME"
        echo ""
        echo "Subscription Details:"
        echo "  ID: $SUBSCRIPTION_ID"
        echo "  Display Name: $SUBSCRIPTION_NAME"
        echo "  State: $SUBSCRIPTION_STATE"
        echo ""
        echo "NOTE: Retrieve subscription keys from Azure Portal or via API"
      else
        log_error "Failed to create subscription"
        log_error "Error: $CREATE_OUTPUT"
        exit 1
      fi

.delete_product_subscription:
  script:
    - |
      log_info "=========================================="
      log_info "Deleting Subscription: $SUBSCRIPTION_ID"
      log_info "=========================================="

      SUBSCRIPTION_URL="${APIM_BASE_URL}/subscriptions/${SUBSCRIPTION_ID}?api-version=${AZURE_API_VERSION}"

      log_debug "Deleting subscription at: $SUBSCRIPTION_URL"
      DELETE_OUTPUT=$(az rest --method DELETE \
        --url "$SUBSCRIPTION_URL" \
        --headers "Content-Type=application/json" \
        --output none 2>&1)
      DELETE_EXIT_CODE=$?

      if [ $DELETE_EXIT_CODE -eq 0 ]; then
        log_ok "Subscription deleted"
        log_audit "delete_product_subscription" "$SUBSCRIPTION_ID" "status=deleted"
      else
        # Check if the error is "subscription not found" which is acceptable
        if echo "$DELETE_OUTPUT" | grep -qi "not found\|does not exist"; then
          log_warn "Subscription not found (already deleted)"
          log_audit "delete_product_subscription" "$SUBSCRIPTION_ID" "status=not_found"
        else
          log_error "Failed to delete subscription"
          log_error "Error: $DELETE_OUTPUT"
          exit 1
        fi
      fi

