    - !reference [.update_product, script]

delete_product_dev:
  extends: .deploy_base
  needs: ["validate_inputs", "backup_product", "plan"]
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|develop)$/ && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "delete_product"
