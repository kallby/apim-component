        --url "$POLICY_URL" \
        --headers "Content-Type=application/json" \
        --output none 2>&1 || true

      log_ok "Operation policy cleared"
      log_audit "clear_operation_policy" "$API_NAME/$OPERATION_ID" "status=cleared"

# ============================================
# Deploy Jobs - Dev Environment
# ============================================
import_api_dev:
  extends: .deploy_base_with_spec
  needs: ["validate_inputs", "validate_spec", "plan"]
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|develop)$/ && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "import_api"
      when: manual
  script:
    - !reference [.import_api, script]

delete_api_dev:
  extends: .deploy_base
  needs: ["validate_inputs", "backup_api", "plan"]
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|develop)$/ && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "delete_api"
      when: manual
  script:
    - !reference [.delete_api, script]

get_api_policy_dev:
  extends: .deploy_base
  needs: ["validate_inputs", "plan"]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|develop)$/ && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $OPERATION == "get_api_policy"
  script:
    - !reference [.get_api_policy, script]
  artifacts:
    paths:
